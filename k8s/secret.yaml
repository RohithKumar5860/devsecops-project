apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: devsecops-app
type: Opaque
data:
  # Add your secrets here (base64 encoded)
  # Example: kubectl create secret generic app-secrets --from-literal=DB_PASSWORD=your_password
  # Or manually encode: echo -n 'your_secret_value' | base64
  
  # DB_PASSWORD: <base64_encoded_value>
  # API_KEY: <base64_encoded_value>
  # JWT_SECRET: <base64_encoded_value>
