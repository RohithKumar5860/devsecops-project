apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Production Overlay ─────────────────────────────────────────────────────
# Deploys the application into the 'prod' namespace with:
#   - DEBUG=False, LOG_LEVEL=WARNING  (strict production)
#   - Higher resource limits (CPU/memory)
#   - Strict liveness/readiness probes (failureThreshold=2)
#   - HPA min=2, max=10

namespace: prod

resources:
  - namespace.yaml
  - ../../base
  - configmap.yaml
  - secret.yaml


patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: devsecops-app
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: devsecops-app-hpa

images:
  - name: rohith0516/devsecops-app
    newTag: latest
