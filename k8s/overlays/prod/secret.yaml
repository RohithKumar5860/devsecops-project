apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: devsecops-app
    environment: prod
type: Opaque
# CRITICAL: APP_SECRET_KEY must be injected by the CI/CD pipeline or an
# external secrets operator before any production deployment.
# The application performs fail-fast validation at startup and will
# refuse to start if this key is absent in production.
#
# Recommended methods (in order of preference):
#   1. External Secrets Operator pulling from HashiCorp Vault / AWS Secrets Manager
#   2. Sealed Secrets (Bitnami) for GitOps-compatible encrypted storage
#   3. kubectl create secret (emergency manual injection):
#        kubectl create secret generic app-secrets \
#          --from-literal=APP_SECRET_KEY="<generated-value>" \
#          -n prod --dry-run=client -o yaml | kubectl apply -f -
#
# Never commit a plaintext APP_SECRET_KEY value to version control.
data: {}
