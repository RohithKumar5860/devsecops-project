apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: devsecops-app
    environment: dev
type: Opaque
# Dev environment: APP_SECRET_KEY is intentionally omitted.
# The application auto-generates an ephemeral key at startup
# when APP_ENV=development and APP_SECRET_KEY is not set.
# Never commit a real APP_SECRET_KEY here.
data: {}
