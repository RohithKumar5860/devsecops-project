apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Dev Overlay ────────────────────────────────────────────────────────────
# Deploys the application into the 'dev' namespace with:
#   - DEBUG=True, LOG_LEVEL=DEBUG
#   - Lower resource limits (CPU/memory)
#   - Relaxed liveness/readiness probes
#   - HPA min=1, max=3

namespace: dev

resources:
  - namespace.yaml
  - ../../base
  - configmap.yaml
  - secret.yaml


patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: devsecops-app
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: devsecops-app-hpa

images:
  - name: rohith0516/devsecops-app
    newTag: latest
