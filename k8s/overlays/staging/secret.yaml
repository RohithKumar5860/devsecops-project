apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: devsecops-app
    environment: staging
type: Opaque
# REQUIRED: APP_SECRET_KEY must be injected before applying this manifest.
# The application will fail to start in staging if this key is absent.
#
# Inject via CI/CD (e.g. GitHub Actions with a repository secret):
#   kubectl create secret generic app-secrets \
#     --from-literal=APP_SECRET_KEY="${{ secrets.APP_SECRET_KEY }}" \
#     -n staging --dry-run=client -o yaml | kubectl apply -f -
#
# Or use an external secrets operator (Sealed Secrets / External Secrets Operator).
# Never commit a plaintext APP_SECRET_KEY value to version control.
data: {}
