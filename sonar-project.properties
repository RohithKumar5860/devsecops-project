# ===============================
# SonarCloud Identification
# ===============================
sonar.projectKey=devsecops-flask-app
sonar.organization=rohithkumar5860
sonar.host.url=https://sonarcloud.io

# ===============================
# Project Metadata
# ===============================
sonar.projectName=DevSecOps Flask Application
sonar.projectVersion=1.0.0

# ===============================
# Source Configuration
# ===============================
sonar.sources=backend
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.py

# ===============================
# Python Configuration
# ===============================
sonar.language=py
sonar.python.version=3.9
sonar.python.coverage.reportPaths=backend/coverage.xml

# ===============================
# Exclusions
# ===============================
sonar.exclusions=**/__pycache__/**,**/venv/**,**/.venv/**,**/node_modules/**,**/migrations/**

# ===============================
# Encoding
# ===============================
sonar.sourceEncoding=UTF-8
