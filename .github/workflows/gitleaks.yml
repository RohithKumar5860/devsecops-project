name: Gitleaks Secrets Scan

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  gitleaks:
    name: Detect Hardcoded Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for accurate scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for organisations; omit for public repos
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # gitleaks-action exits non-zero automatically when secrets are found,
        # which propagates the failure to GitHub Actions without any extra flag.
        # Detected secret categories include (but are not limited to):
        #   - Hardcoded API keys
        #   - AWS access key / secret key credentials
        #   - JWT secrets and tokens
        #   - Committed .env files containing secrets
