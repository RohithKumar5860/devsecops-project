name: Release Pipeline

# Triggered on semantic version tags (e.g. v1.2.3)
# Builds and pushes the Docker image, then notifies about Kubernetes deployment

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-app

jobs:
  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Release Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_IMAGE }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deployment Notification
      run: |
        echo "=== Release Deployment ==="
        echo "Tag:   ${{ github.ref_name }}"
        echo "Image: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}"
        echo ""
        echo "Apply Kubernetes manifests with:"
        echo "  kubectl apply -f k8s/"
        echo ""
        echo "Kubernetes manifests are ready in the k8s/ directory."
        echo "Configure kubectl credentials in repository secrets to automate this step."
