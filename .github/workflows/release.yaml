name: Release Pipeline

# ──────────────────────────────────────────────────────────────────────────────
# Triggered on semantic version tags (e.g. v1.2.3)
#
# Flow:
#   1. security-gates  – pip-audit CVE scan + Docker build + Trivy scan
#   2. build-push      – Push versioned image to Docker Hub (only if gates pass)
#   3. deploy-prod     – Deploy to 'prod' namespace via Kustomize overlay
#
# If security-gates fail → build-push and deploy-prod are BLOCKED.
# No production deployment ever occurs with unresolved CVEs.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-app
  PYTHON_VERSION: '3.9'

# ── Job 1: Security Gates (required before prod deploy) ───────────────────────
jobs:
  security-gates:
    name: Security Gates (pip-audit + Trivy)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pip-audit

    - name: Run pip-audit (Dependency CVE Gate)
      run: |
        pip-audit -r backend/requirements.txt --strict
      # --strict: pipeline fails immediately on any CVE.
      # Production release is BLOCKED until all CVEs are resolved.

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image for Scanning
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: false
        load: true
        tags: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}

    - name: Run Trivy Container Scan (Release Gate)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
      continue-on-error: true

    - name: Run Trivy – Generate SARIF Report
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
      continue-on-error: true

    - name: Upload Trivy Results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

# ── Job 2: Build and Push Versioned Docker Image ──────────────────────────────
  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: security-gates   # BLOCKED if security-gates fail

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Release Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_IMAGE }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

# ── Job 3: Deploy to Production ───────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production Namespace
    runs-on: ubuntu-latest
    needs: [ security-gates, build-push ]   # Both must pass
    environment: prod

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Production (Kustomize)
      run: |
        echo "════════════════════════════════════════"
        echo "  SECURITY GATES: PASSED ✅"
        echo "  Deploying to: prod namespace"
        echo "  Release Tag:  ${{ github.ref_name }}"
        echo "  Image:        ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}"
        echo "════════════════════════════════════════"
        echo ""
        echo "To deploy locally, run:"
        echo "  kubectl apply -k k8s/overlays/prod/"
        echo "  kubectl rollout status deployment/devsecops-app -n prod"
        echo ""
        echo "Verify:"
        echo "  kubectl get all -n prod"
        echo "  kubectl get configmap app-config -n prod -o yaml"
        echo "  kubectl get hpa -n prod"
        # In a live cluster, replace the echo block with:
        # kubectl apply -k k8s/overlays/prod/
        # kubectl rollout status deployment/devsecops-app -n prod --timeout=180s
